# -------------------------------
# HTTPS SERVER (ONLY SERVE, NO REDIRECTS)
# -------------------------------
server {
    listen 443 ssl http2;
    server_name blackhatbadshah.com;

    ssl_certificate /etc/letsencrypt/live/blackhatbadshah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blackhatbadshah.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:7001;
        proxy_http_version 1.1;

        # 🔴 REQUIRED for SignalR / WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# -------------------------------
# HTTP → HTTPS REDIRECT (ONLY HERE)
# -------------------------------
server {
    listen 80;
    server_name blackhatbadshah.com;

    return 301 https://$host$request_uri;
}

